<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Records | Postura</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles-home.css" />
    <link rel="stylesheet" href="styles-records.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="frame">
      <header class="top-bar">
        <div class="logo-circle" aria-label="Postura logo">
          <img src="logo.png" alt="Postura logo" class="logo-img" />
        </div>
        <nav class="tabs" aria-label="Main navigation">
          <a href="home.html" class="tab">Home</a>
          <button class="tab is-active" type="button">Records</button>
          <a href="faq.html" class="tab">FaQ</a>
          <a href="about.html" class="tab">About Us</a>
        </nav>
        <hr class="divider" />
      </header>

      <main>
        <section class="records-table" aria-label="Posture records">
          <div class="records-header">
            <span class="records-title">Records</span>
            <div class="records-page">
              <button id="prev-page" class="records-page-arrow" style="display:none; background:none; border:1px solid #000; border-radius:4px; cursor:pointer; padding:4px 10px; font-size:18px;">&lt;</button>
              <span id="page-label" class="records-page-label">Page 1 of 1</span>
              <button id="next-page" class="records-page-arrow" style="display:none; background:none; border:1px solid #000; border-radius:4px; cursor:pointer; padding:4px 10px; font-size:18px;">&gt;</button>
            </div>
          </div>

          <div class="records-columns">
            <div class="records-col">Image</div>
            <div class="records-col">Posture Condition</div>
            <div class="records-col">Recommendation</div>
            <div class="records-col">Date</div>
            <div class="records-col">Actions</div>
          </div>

          <div id="records-body"></div>

          <p id="records-empty-msg" class="records-empty" style="display:none;">
            No posture records yet. Upload a photo to get started!
          </p>
        </section>
      </main>
    </div>
  </body>
</html>
