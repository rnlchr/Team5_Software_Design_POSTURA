<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | Figma Landing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <div class="login-frame">
        <main class="auth-panel">
          <div class="auth-logo-wrapper">
            <div class="auth-logo-circle">
              <img src="logo.png" alt="Postura logo" class="auth-logo-img" />
            </div>
          </div>
          <h1 class="auth-title">FORGOT PASSWORD</h1>

          <section class="card form-card" aria-label="Forgot password form">
            <form class="form" autocomplete="off">
              <div class="field">
                <label for="old-password" class="field-label">Old Password</label>
                <div class="field-input">
                  <input
                    id="old-password"
                    name="old-password"
                    type="password"
                    placeholder="Old Password"
                    required
                  />
                </div>
              </div>

              <div class="field">
                <label for="new-password" class="field-label">New Password</label>
                <div class="field-input">
                  <input
                    id="new-password"
                    name="new-password"
                    type="password"
                    placeholder="New Password"
                    required
                  />
                </div>
              </div>

              <div class="field">
                <label for="confirm-password" class="field-label"
                  >Confirm Password</label
                >
                <div class="field-input">
                  <input
                    id="confirm-password"
                    name="confirm-password"
                    type="password"
                    placeholder="Confirm Password"
                    required
                  />
                </div>
              </div>

              <div class="button-row primary-row" style="justify-content: space-between; gap: 16px;">
                <a
                  href="index.html"
                  class="btn btn-outline"
                  style="width: 48%; text-decoration: none;"
                >
                  <span>Cancel</span>
                </a>
                <button
                  type="submit"
                  class="btn btn-primary"
                  style="width: 48%;"
                >
                  <span>Reset Password</span>
                </button>
              </div>
            </form>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
