<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Records - Page 2 | Postura</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles-home.css" />
    <link rel="stylesheet" href="styles-records.css" />
  </head>
  <body>
    <div class="frame">
      <header class="top-bar">
        <div class="logo-circle" aria-label="Postura logo">
          <img src="logo.png" alt="Postura logo" class="logo-img" />
        </div>

        <nav class="tabs" aria-label="Main navigation">
          <a href="home.html" class="tab">Home</a>
          <button class="tab is-active" type="button">Records</button>
          <a href="faq.html" class="tab">FaQ</a>
          <a href="about.html" class="tab">About Us</a>
        </nav>

        <hr class="divider" />
      </header>

      <main>
        <section class="records-table" aria-label="Posture records Page 2">
          <div class="records-header">
            <span class="records-title">Records</span>
            <div class="records-page">
              <a href="records.html" class="records-page-arrow" aria-label="Back to page 1">
                &lt;
              </a>
              <span class="records-page-label">Page 2 of 5</span>
            </div>
          </div>

          <div class="records-columns">
            <div class="records-col">Image</div>
            <div class="records-col">Posture Condition</div>
            <div class="records-col">Recommendation</div>
            <div class="records-col">Date</div>
            <div class="records-col">Actions</div>
          </div>

          <p class="records-empty">
            No history yet on this page. Each page can hold up to 5 entries.
          </p>
        </section>
      </main>
    </div>
  </body>
</html>
